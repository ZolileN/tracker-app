<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget Tracker</title>
<style>
:root{
  color-scheme:light;
  --bg:#f4f3f0; --surface:#fcfcfb; --surface-2:#f0efec; --line:#e1dfd9;
  --text:#0b0b0b; --text-2:#52514e; --text-3:#7d7b76;
  --series-1:#2a78d6; --series-2:#eb6834; --track:#e7e5df;
  --good:#1a7f37; --warn:#9a6700; --bad:#c62828; --bad-bg:#fdecea; --good-bg:#e7f4ea; --warn-bg:#fff4d6;
  --accent:#1f5fae; --accent-ink:#fff; --radius:10px;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#242422; --line:#33332f;
    --text:#f0efec; --text-2:#c3c2b7; --text-3:#8f8e85;
    --series-1:#3987e5; --series-2:#d95926; --track:#2c2c29;
    --good:#4cc26a; --warn:#e0a82e; --bad:#ff7b72; --bad-bg:#3a1c1a; --good-bg:#16301d; --warn-bg:#362b0f;
    --accent:#3987e5; --accent-ink:#fff;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 16px 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em}
.sync{font-size:12px;color:var(--text-3);margin-left:auto}
.sync.err{color:var(--bad)}
nav.tabs{display:flex;gap:2px;width:100%;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:8px 12px;color:var(--text-2);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
nav.tabs a.on{color:var(--text);border-bottom-color:var(--accent)}
main{max-width:1120px;margin:0 auto;padding:16px 16px 80px}
.banner{background:var(--warn-bg);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:12px;font-size:13px}
.banner.err{background:var(--bad-bg)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar .grow{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.card h2{font-size:14px;margin:0 0 2px;font-weight:650}
.card .sub{color:var(--text-3);font-size:12px;margin:0 0 12px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.two{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.half{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.half{grid-template-columns:minmax(0,1fr)}}
.kpi .lab{color:var(--text-2);font-size:12px}
.kpi .val{font-size:22px;font-weight:650;letter-spacing:-.02em;margin-top:2px}
.kpi .note{color:var(--text-3);font-size:12px;margin-top:2px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
select,input[type=text],input[type=number],input[type=date],input[type=search],textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px;min-width:0}
select:focus,input:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
table{border-collapse:collapse;width:100%}
th{font-size:12px;color:var(--text-3);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.desc{max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--text-3)} .small{font-size:12px}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--surface-2);color:var(--text-2);white-space:nowrap}
/* category bars */
.hb{display:grid;grid-template-columns:minmax(90px,170px) 1fr auto;gap:4px 10px;align-items:center}
.hb .row{display:contents;cursor:pointer}
.hb .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)}
.hb .trk{height:16px;position:relative}
.hb .fill{position:absolute;left:0;top:0;bottom:0;background:var(--series-1);border-radius:0 4px 4px 0;min-width:2px}
.hb .row:hover .name{color:var(--text)}
.hb .row:hover .fill{filter:brightness(1.12)}
.hb .v{text-align:right}
.meter{height:8px;background:var(--track);border-radius:99px;overflow:hidden;min-width:80px}
.meter i{display:block;height:100%;background:var(--series-1);border-radius:99px}
.meter.over i{background:var(--bad)} .meter.near i{background:var(--warn)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg text{fill:var(--text-3);font-size:11px;font-family:inherit}
svg .gl{stroke:var(--line);stroke-width:1}
svg .hit{fill:transparent}
svg .hit:hover{fill:var(--text);fill-opacity:.05}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--text);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:12px;max-width:260px;display:none;white-space:pre-line;box-shadow:0 2px 8px rgba(0,0,0,.2)}
ul.ins{margin:0;padding-left:18px} ul.ins li{margin:5px 0}
.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:28px 16px;text-align:center;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--surface-2)}
.ok{color:var(--good)} .warnc{color:var(--warn)} .badc{color:var(--bad)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:6vh 12px;overflow:auto}
.modal{background:var(--surface);border-radius:12px;padding:18px;width:100%;max-width:440px;border:1px solid var(--line)}
.modal h3{margin:0 0 12px;font-size:16px}
.f{display:grid;gap:4px;margin-bottom:10px} .f label{font-size:12px;color:var(--text-2)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:7px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 12px;border-radius:10px;z-index:45;display:flex;gap:10px;align-items:center;max-width:calc(100vw - 24px);flex-wrap:wrap;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.toast .btn{background:transparent;color:inherit;border-color:currentColor}
.empty{text-align:center;padding:40px 16px}
.empty h2{font-size:18px;margin:0 0 6px}
td select{max-width:190px;padding:4px 6px}
.rowbtn{border:0;background:transparent;cursor:pointer;color:var(--text-3);padding:2px 6px;border-radius:6px}
.rowbtn:hover{background:var(--surface-2);color:var(--text)}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">Budget Tracker</div>
  <div class="sync" id="sync"></div>
  <nav class="tabs" id="tabs"></nav>
</div></header>
<main id="main"><div class="card empty"><p class="muted">Loading your data…</p></div></main>
<div id="tip"></div>
<div id="overlay"></div>
<input type="file" id="file" accept=".pdf,.csv,.txt,.ofx,.qfx,.qif,application/pdf,text/csv,application/x-ofx" multiple hidden>
<input type="file" id="bfile" accept=".json,application/json" hidden>
